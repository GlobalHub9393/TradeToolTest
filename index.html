<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Supabase Test</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1220;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
    .card{width:min(92vw,520px);background:#111827;border:1px solid #273244;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
    h1{margin:.35rem 0 1rem;font-size:32px}
    .status{font-size:16px;margin-bottom:18px}
    .label{opacity:.7;font-size:14px}
    .version{font-size:52px;font-weight:800;margin-top:4px}
    .error{color:#fca5a5;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Supabase Test</div>
    <h1>Global Trade Tool</h1>
    <div id="status" class="status">Connecting…</div>
    <div class="label">Current Version</div>
    <div id="version" class="version">—</div>
    <div id="error" class="error"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://uwomiirfvllcafijmkmk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_UMb8Nb5DG0w1dv9h5W5-2Q_0PinuBV4";

    async function loadVersion() {
      const status = document.getElementById("status");
      const version = document.getElementById("version");
      const errorBox = document.getElementById("error");

      try {
        const endpoint =
          SUPABASE_URL +
          '/rest/v1/ToolTest?select=Setting_value&Setting_key=eq.Current_version&limit=1';

        const res = await fetch(endpoint, {
          headers: {
            apikey: SUPABASE_PUBLISHABLE_KEY,
            Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
          }
        });

        if (!res.ok) {
          throw new Error(`${res.status} ${res.statusText}\n${await res.text()}`);
        }

        const rows = await res.json();

        if (!rows.length) {
          status.textContent = "Connected ✓";
          version.textContent = "Not found";
          return;
        }

        status.textContent = "Connected ✓";
        version.textContent = rows[0].Setting_value;
      } catch (err) {
        status.textContent = "Connection failed";
        errorBox.textContent = err.message;
      }
    }

    loadVersion();
  </script>
</body>
</html>
